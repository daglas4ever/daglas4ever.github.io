<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Mohammad Daghlas &mdash; Enhanced Version</title>
    <meta name="description" content="Enhanced canvas experiments">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="./enhanced/enhanced.css" />
</head>

<body class="galleryBody">
    <div class="mainContainer">
        <div class="header">
            <h1>Enhanced Canvas Experiments</h1>
            <p class="subtitle">Pick one to open it in full screen</p>
            <a class="backLink" href="./index.html">&larr; Back to original</a>
        </div>

        <div class="gallery">

            <div class="previewCard">
                <div class="previewBox" id="EnhCloudParent">
                    <canvas id="EnhCloudCanvas"></canvas>
                </div>
                <div class="previewLabel">Raining Cloud</div>
                <a class="previewOverlay" href="./enhanced/cloud.html" aria-label="Open Raining Cloud"></a>
                <script src="./enhanced/RainingCloud.js"></script>
            </div>

            <div class="previewCard">
                <div class="previewBox" id="EnhCircularParent">
                    <canvas id="EnhCircularCanvas"></canvas>
                </div>
                <div class="previewLabel">Circular Motion</div>
                <a class="previewOverlay" href="./enhanced/circular.html" aria-label="Open Circular Motion"></a>
                <script src="./enhanced/CircularMotion.js"></script>
            </div>

            <div class="previewCard">
                <div class="previewBox" id="EnhRectParent">
                    <canvas id="EnhRectCanvas"></canvas>
                </div>
                <div class="previewLabel">Rectangles</div>
                <a class="previewOverlay" href="./enhanced/rectangles.html" aria-label="Open Rectangles"></a>
                <script src="./enhanced/Rectangles.js"></script>
            </div>

            <div class="previewCard">
                <div class="previewBox" id="EnhGravityParent">
                    <canvas id="EnhGravityCanvas"></canvas>
                </div>
                <div class="previewLabel">Gravity</div>
                <a class="previewOverlay" href="./enhanced/gravity.html" aria-label="Open Gravity"></a>
                <script src="./enhanced/Gravity.js"></script>
            </div>

            <div class="previewCard">
                <div class="previewBox" id="EnhCirFloParent">
                    <canvas id="EnhCirFloCanvas"></canvas>
                </div>
                <div class="previewLabel">Circles Floating</div>
                <a class="previewOverlay" href="./enhanced/circles.html" aria-label="Open Circles Floating"></a>
                <script src="./enhanced/CirclesFloating.js"></script>
            </div>

        </div>
    </div>

    <script src="./enhanced/enhanced.js"></script>

</html>
